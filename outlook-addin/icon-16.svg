<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="16" height="16" fill="#0f172a" rx="2.4"/>

  <!-- Checklist icon -->
  <g transform="translate(3.2, 3.2)">
    <!-- Paper/Document -->
    <rect x="0" y="0" width="9.6" height="10.4" fill="white" rx="0.8"/>

    <!-- Check marks -->
    <g stroke="#10b981" stroke-width="1.28" stroke-linecap="round" fill="none">
      <!-- First check -->
      <polyline points="1.6,2.4 2.4,3.2 4,1.28" />
      <!-- Second check -->
      <polyline points="1.6,4.8 2.4,5.6 4,3.68" />
      <!-- Third check (partial) -->
      <line x1="1.6" y1="7.2" x2="3.2" y2="7.2" stroke="#94a3b8" />
    </g>

    <!-- Lines for tasks -->
    <g stroke="#cbd5e1" stroke-width="0.32">
      <line x1="4.8" y1="2.4" x2="8.8" y2="2.4" />
      <line x1="4.8" y1="4.8" x2="8.8" y2="4.8" />
      <line x1="4.8" y1="7.2" x2="8.8" y2="7.2" />
    </g>
  </g>

  <!-- Small envelope indicator (bottom right) -->
  <g transform="translate(8.8, 9.6)">
    <rect x="0" y="0" width="5.6" height="4" fill="#3b82f6" rx="0.48"/>
    <polyline points="0,0 2.8,1.92 5.6,0"
              fill="none" stroke="white" stroke-width="0.48" stroke-linecap="round"/>
  </g>
</svg>
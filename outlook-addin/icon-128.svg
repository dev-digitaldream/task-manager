<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="128" fill="#0f172a" rx="19.2"/>

  <!-- Checklist icon -->
  <g transform="translate(25.6, 25.6)">
    <!-- Paper/Document -->
    <rect x="0" y="0" width="76.8" height="83.2" fill="white" rx="6.4"/>

    <!-- Check marks -->
    <g stroke="#10b981" stroke-width="10.24" stroke-linecap="round" fill="none">
      <!-- First check -->
      <polyline points="12.8,19.2 19.2,25.6 32,10.24" />
      <!-- Second check -->
      <polyline points="12.8,38.4 19.2,44.8 32,29.44" />
      <!-- Third check (partial) -->
      <line x1="12.8" y1="57.6" x2="25.6" y2="57.6" stroke="#94a3b8" />
    </g>

    <!-- Lines for tasks -->
    <g stroke="#cbd5e1" stroke-width="2.56">
      <line x1="38.4" y1="19.2" x2="70.4" y2="19.2" />
      <line x1="38.4" y1="38.4" x2="70.4" y2="38.4" />
      <line x1="38.4" y1="57.6" x2="70.4" y2="57.6" />
    </g>
  </g>

  <!-- Small envelope indicator (bottom right) -->
  <g transform="translate(70.4, 76.8)">
    <rect x="0" y="0" width="44.8" height="32" fill="#3b82f6" rx="3.84"/>
    <polyline points="0,0 22.4,15.36 44.8,0"
              fill="none" stroke="white" stroke-width="3.84" stroke-linecap="round"/>
  </g>
</svg>